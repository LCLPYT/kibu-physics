import org.apache.tools.ant.filters.ReplaceTokens
import work.lclpnet.build.task.GithubDeploymentTask

plugins {
    alias(libs.plugins.fabric.loom)
    alias(libs.plugins.maven.publish)
    alias(libs.plugins.gradle.build.utils)
}

Properties props = buildUtils.loadProperties('publish.properties')

version = "$project.mod_version+${libs.versions.minecraft.get()}${project.snapshot_version == 'true' ? '-SNAPSHOT' : ''}"
group = project.maven_group

def modId = project.mod_id
def javaVersion = libs.versions.java.get().toInteger()

base {
    archivesName = modId
}

repositories {
    maven {
        url "https://repo.lclpnet.work/repository/internal"
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath + main.getOutput()
        runtimeClasspath += main.runtimeClasspath + main.getOutput()
    }
}

loom {
    runs {
        named("server") {
            source "testmod"
        }

        named("client") {
            source "testmod"
        }
    }

    accessWidenerPath = file("src/testmod/resources/kibu-physics-test.accesswidener")
}

dependencies {
    minecraft(libs.minecraft)
    implementation(libs.fabric.loader)
    implementation(libs.fabric.api)

    implementation(libs.kibu.hook.api)
    include(libs.kibu.hook.api)

    // libbulletjme JVM library
    api(libs.libbulletjme.linux.x64)
    include(libs.libbulletjme.linux.x64)

    // libbulletjme native libraries
    /* JME flavors:
     * Sp (single-precision arithmetic)
     * SpMt (single-precision arithmetic, multithreaded), unsupported on MacOSX
     * Dp (double-precision arithmetic)
     * DpMt (double-precision arithmetic, multithreaded), unsupported on MacOSX
     *
     * JME modes:
     * Release: Release build
     * Debug: Build with debug symbols, profiler support etc.
     */
    def variant = "SpRelease"

    def includeRuntime = { Provider<MinimalExternalModuleDependency> dep ->
        runtimeOnly(dep)
        include(dep)
    }

    includeRuntime(variantOf(libs.libbulletjme.linux.x64) { classifier(variant) })
    includeRuntime(variantOf(libs.libbulletjme.linux.arm64) { classifier(variant) })
    includeRuntime(variantOf(libs.libbulletjme.windows.x64) { classifier(variant) })
    includeRuntime(variantOf(libs.libbulletjme.macosx.x64) { classifier(variant) })
    includeRuntime(variantOf(libs.libbulletjme.macosx.arm64) { classifier(variant) })

    // for platform-specific native library loading
    implementation(libs.snaploader)
    include(libs.snaploader)

    compileOnly(libs.kibu.access.lib)
    localRuntime(libs.kibu.access.lib)
}

[processResources, processTestmodResources].each {
    def tokens = [
            "version": project.version.toString(),
            "loader_version": libs.versions.fabric.loader.get(),
            "minecraft_compat": project.minecraft_compat,
            "java_version": javaVersion.toString()
    ]

    it.inputs.properties(tokens)

	it.filesMatching("fabric.mod.json") {
        expand(tokens)
	}

    it.filesMatching("*.mixins.json") {
        filter(ReplaceTokens, beginToken: '${', endToken: '}', tokens: tokens)
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release.set(javaVersion)
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    withSourcesJar()

    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

[jar, sourcesJar].each {
	it.from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

def env = System.getenv()

tasks.register("github", GithubDeploymentTask) {
    dependsOn tasks.jar

    config {
        token = env.get("GITHUB_TOKEN")
        repository = env.get("GITHUB_REPOSITORY")
    }

    release {
        title = "[${libs.versions.minecraft.get()}] kibu-physics $project.version${project.snapshot_version == 'true' ? '-SNAPSHOT' : ''}"
        tag = "$project.mod_version${project.snapshot_version == 'true' ? '-SNAPSHOT' : ''}"
    }

    assets.add(tasks.jar.archiveFile.get())
}

// configure the maven publication
publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.base.archivesName.get()

            from components.java

            pom {
                name = 'kibu-physics'
                description = 'A physics simulation API for Fabric'
            }
        }
    }

    // automatically use DEPLOY_URL, DEPLOY_USER and DEPLOY_PASSWORD environment variables
    // or mavenHost, mavenUser and mavenPassword from props
    buildUtils.setupPublishRepository(repositories, props)
}